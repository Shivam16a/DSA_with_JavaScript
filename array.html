<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array</title>
    <script>
        const myarray = [12, 14, 45, 0, 7, 8, 6, 10, 2]
        // for (let i = 0; i < myarray.length; i++) {
        //     document.write(`${myarray[i]}<br>`)
        // }
        // document.write(myarray[myarray.length - 1])
        // console.log(element)
        function getelement(){
            let element = document.getElementById("element").value;
            let result = document.getElementById("result")

            // result.innerHTML = `${element}`
            
            if(myarray[element] === undefined){
                result.innerHTML = `Invalid Element: ${element} <br>Please Enter Valid Index: 0 to ${myarray.indexOf(myarray[myarray.length-1])}`
            }else{
                result.innerHTML = `${myarray[element]}`
            }
        }

    </script>

</head>

<body>
    <input type="text" id="element">
    <button onclick="getelement()">Get number</button>

    <p id="result"></p>
</body>

</html>
