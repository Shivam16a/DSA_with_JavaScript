<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insertion Sort in JavaScript</title>
</head>

<body>
    <h1>Insertion Sort In JavaScript</h1>

    <script>
        let item = [12, 11, 13, 5, 6];

        function insertionSort(item) {
            let i, current, j;
            for (i = 1; i < item.length; i++) {
                current = item[i];
                j = i - 1;
                while (j >= 0 && current < item[j]) {
                    item[j + 1] = item[j];
                    j = j - 1;
                }
                item[j + 1] = current;
            }
            console.log(item)
        }
        insertionSort(item);
        console.log(item);
    </script>
</body>

</html>
