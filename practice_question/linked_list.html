<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice time </title>
</head>

<body>
    <script>
        class Linked {
            constructor(data) {
                this.data = data;
                this.next = null;
            }
        }
        let a = new Linked(10);
        let b = new Linked(20);
        let c = new Linked(30);

        a.next = b;
        b.next = c;
        let current = a;

        while (current !== null) {
            console.warn(current.data);
            current = current.next;
        }
    </script>
</body>

</html>
