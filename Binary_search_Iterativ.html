<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Search Iterativ</title>
</head>

<body>



    <script>
        let item = [10, 20, 30, 40, 50, 60, 70, 80, 90, 95, 100];
        let target = 80;

        function binarysearch(item, target) {
            let left = 0;
            let right = item.length - 1;


            // console.warn(right);


            while (left <= right) {
                let mid = Math.floor((left + right) / 2);

                if (item[mid] == target) {
                    return mid;
                }

                if (item[mid] < target) {
                    left = mid + 1;
                } else {
                    right = mid - 1;
                }
            }

            return "Element not found";
        }

        console.warn(binarysearch(item, target));
    </script>
</body>

</html>
