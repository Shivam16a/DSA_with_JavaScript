<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linked List in JavaScript </title>
</head>

<body>
    <script>
        class List {
            constructor(data) {
                this.head = {
                    value: data,
                    next: null,
                };
                this.tail = this.head;
                this.size = 1;
            }
            appendNode(nodeData) {
                let newNode = {
                    value: nodeData,
                    next: null,
                };
                this.tail.next = newNode;
                this.tail = newNode;
                this.size += 1;
            }
            updateNode(oldNode, newNode) {
                let currentNode = this.head;
                let counter = 0;
                while (counter < this.size) {
                    if (currentNode.value === oldNode) {
                        currentNode.value = newNode;
                        return;
                    }
                    currentNode = currentNode.next;
                    counter++;
                }
            }
            travers() {
                let counter = 0;
                let currentNode = this.head;
                while (counter < this.size) {
                    console.warn(currentNode);
                    currentNode = currentNode.next;
                    counter++;
                }
                // console.warn(currentNode);
            }
        }

        let list = new List(200);
        list.appendNode(300);
        list.appendNode(400);
        list.appendNode(500);
        list.appendNode(600);
        list.appendNode(700);
        list.appendNode(800);
        list.updateNode(400, 999);
        list.travers();
        // console.warn(list);
    </script>
</body>

</html>
