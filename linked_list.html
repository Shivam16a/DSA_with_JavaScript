<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linked List in JavaScript </title>
</head>

<body>
    <script>
        class List {
            constructor(data) {
                this.head = {
                    value: data,
                    next: null,
                };
                this.tail = this.head;
                this.size = 1;
            }
            appendNode(nodeData) {
                let newNode = {
                    value: nodeData,
                    next: null,
                };
                this.tail.next = newNode;
                this.tail = newNode;
                this.size += 1;
            }
            updateNode(oldNode, newNode) {
                let currentNode = this.head;
                let counter = 0;
                while (counter < this.size) {
                    if (currentNode.value === oldNode) {
                        currentNode.value = newNode;
                        return;
                    }
                    currentNode = currentNode.next;
                    counter++;
                }
            }
            deleteNode(index) {
                let lead = this.head;
                let counter = 1;
                if (index === 1) {
                    this.head = this.head.next;
                } else {
                    while (counter < index - 1) {
                        lead = lead.next;
                        counter++;
                    }
                    let nextNode = lead.next.next;
                    lead.next = nextNode;
                }
            }
            insertNode(index, value) {
                let counter = 1;
                let currentNode = this.head;
                while (counter < index) {
                    currentNode = currentNode.next;
                    counter++;
                }
                let nextNode = currentNode.next;
                currentNode.next = {
                    value: value,
                    next: nextNode,
                }
            }

            travers() {
                let counter = 0;
                let currentNode = this.head;
                while (counter < this.size) {
                    console.warn(currentNode);
                    currentNode = currentNode.next;
                    counter++;
                }
                // console.warn(currentNode);
            }

            searchNode(data) {
                let result = undefined;
                let lead = this.head;
                let loop = true;

                while (loop) {
                    lead = lead.next;
                    loop = !!lead;
                    if (loop && lead.value === data) {
                        loop = false;
                        result = lead;
                    }
                }
                console.warn(result);
            }
        }

        let list = new List(200);
        list.appendNode(300);
        list.appendNode(400);
        list.appendNode(500);
        list.appendNode(600);
        list.appendNode(700);
        list.appendNode(800);
        list.updateNode(400, 999);
        list.insertNode(2, 456);
        // list.deleteNode(5);
        list.travers();
        list.searchNode(300);
        // console.warn(list);
    </script>
</body>

</html>
