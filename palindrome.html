<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check String is Palindrome</title>
</head>

<body>
    <h1>Check String is Palindrom or Not in JavaScript</h1>
    <script>
        function palindrome(item) {
            let start = 0;
            let end = item.length - 1;
            while (end > start) {
                if (item[start] !== item[end]) {
                    return "Given String is not palindrome";
                }
                start++;
                end--;
            }
            return "String is palindrom";
        }
        let str = "Level";
        console.warn(palindrome(str.toLocaleUpperCase()))
    </script>
</body>

</html>
