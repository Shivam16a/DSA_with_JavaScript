<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recusive Binary Search</title>
</head>

<body>

    <script>
        let item = [10, 20, 30, 40, 50, 60, 70, 80, 90, 95, 100];
        let start = 0;
        let end = item.length - 1;
        find = 80;
        let position = undefined;
        function recursiveBinarySerach(item, start, end) {
            mid = Math.floor((start + end) / 2);
            // console.warn(mid);
            if (item[mid] == find) {
                position = mid;
                return position;
            } else if (item[mid] < find) {
                recursiveBinarySerach(item, mid + 1, end);
            } else {
                recursiveBinarySerach(item, start, mid - 1);
            }
        }
        recursiveBinarySerach(item, start, end)
        console.warn(position);
    </script>
</body>

</html>
