<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circular Queue</title>
</head>

<body>

    <script>
        class Queue {
            constructor(size) {
                this.maxSize = size;
                this.item = new Array(size);
                this.currentSize = 0;
                this.rear = -1;
                this.front = -1;
            }
            enqueue(val) {
                if (this.currentSize != this.maxSize) {
                    if (this.rear == this.maxSize - 1) {
                        this.rear = 0;
                    } else {
                        this.rear++;
                    }
                    this.item[this.rear] = val;
                    this.currentSize++;
                    if (this.front == -1) {
                        this.front = this.rear;
                    }
                }
            }

            dequeue() {
                if (this.currentSize != 0) {
                    this.item[this.front] = null;
                    if (this.front == this.maxSize - 1) {
                        this.front = 0;
                    } else {
                        this.front++;
                    }
                    this.currentSize--;
                } else {
                    this.front = -1;
                    this.rear = -1;
                    alert("Queue is Empty");
                }
            }
        }


        let queue = new Queue(5);
    </script>
</body>

</html>
