<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack with input</title>
    <script>
        let data = [];
        let currentSize = data.length;
        let max = 5;
        function push() {
            let newval = document.getElementById("newval").value;
            if(newval === ""){
                alert("Add Element");
                return;
            }

            
            if (currentSize >= max) {
                alert("Stack is full you can't add element", newval);
                return;
            } else {
                data[currentSize] = newval;
                currentSize += 1;
                document.getElementById("newval").value = "";
            }
        }
        function pop() {
            if (currentSize > 0) {
                currentSize = currentSize - 1;
                data[currentSize];
                data.length = currentSize;
            } else {
                alert("Stack is empty");
                return;
            }
        }
        function display() {
            console.warn(data);
        }
    </script>
</head>

<body>
    <h1>Stack in JavaScript</h1>
    <input type="text" placeholder="Enter Element ...." id="newval">
    <button onclick="push()">Add Element</button>
    <button onclick="pop()">Remove Element</button>
    <button onclick="display()">Display Element</button>
</body>

</html>
